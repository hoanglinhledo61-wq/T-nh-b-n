<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💗 Tình Bạn - Friendship Game</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e9cff);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.game {
    width: 100%;
    max-width: 430px;
    min-height: 720px;
    background: rgba(20, 20, 45, 0.92);
    border-radius: 30px;
    padding: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
    position: relative;
    overflow: hidden;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.stats {
    display: flex;
    gap: 8px;
}

.stat {
    background: rgba(255,255,255,.12);
    padding: 7px 10px;
    border-radius: 15px;
    font-size: 13px;
}

.profile {
    text-align: center;
    margin-top: 15px;
}

.avatar {
    width: 100px;
    height: 100px;
    margin: auto;
    border-radius: 50%;
    background: linear-gradient(135deg,#ff5f9e,#ffcf70);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 55px;
    box-shadow: 0 0 30px rgba(255,105,180,.5);
}

.profile h1 {
    margin-top: 15px;
    font-size: 27px;
}

.profile p {
    color: #c9c9d8;
    margin-top: 5px;
}

.progress-box {
    margin-top: 22px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 7px;
    color: #ddd;
}

.progress {
    height: 12px;
    background: rgba(255,255,255,.12);
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#ff5fa2,#ffd166);
    border-radius: 20px;
    transition: .5s;
}

.card {
    margin-top: 25px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 23px;
    padding: 20px;
}

.question-number {
    color: #ff9ec5;
    font-size: 14px;
    margin-bottom: 10px;
}

.question {
    font-size: 21px;
    line-height: 1.4;
    margin-bottom: 20px;
}

.answers {
    display: grid;
    gap: 11px;
}

.answer {
    width: 100%;
    border: none;
    padding: 15px;
    border-radius: 16px;
    background: rgba(255,255,255,.1);
    color: white;
    text-align: left;
    font-size: 15px;
    cursor: pointer;
    transition: .2s;
}

.answer:hover {
    background: rgba(255,255,255,.2);
    transform: translateY(-2px);
}

.answer.correct {
    background: #20c997;
}

.answer.wrong {
    background: #ff4d6d;
}

button:disabled {
    cursor: default;
}

.next {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    border: none;
    border-radius: 17px;
    background: linear-gradient(135deg,#ff5f9e,#ff8a5b);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    display: none;
}

.next:hover {
    transform: scale(1.02);
}

.message {
    text-align: center;
    min-height: 25px;
    margin-top: 15px;
    font-weight: bold;
}

.bottom {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 9px;
    margin-top: 20px;
}

.bottom button {
    border: none;
    padding: 12px 5px;
    border-radius: 15px;
    background: rgba(255,255,255,.09);
    color: white;
    cursor: pointer;
}

.bottom button:hover {
    background: rgba(255,255,255,.17);
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(12,12,30,.96);
    display: none;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
    z-index: 5;
}

.result h2 {
    font-size: 32px;
    margin-bottom: 12px;
}

.result p {
    color: #ccc;
    line-height: 1.6;
}

.restart {
    margin-top: 20px;
    border: none;
    padding: 14px 25px;
    border-radius: 18px;
    background: linear-gradient(135deg,#ff5f9e,#ff8a5b);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.heart {
    position: fixed;
    animation: fly 1.5s ease-out forwards;
    pointer-events: none;
    font-size: 25px;
}

@keyframes fly {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(-180px) scale(1.8);
        opacity: 0;
    }
}

@media(max-height:750px) {
    .game {
        min-height: auto;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="top">
        <div class="logo">💗 Tình Bạn</div>

        <div class="stats">
            <div class="stat">⭐ <span id="score">0</span></div>
            <div class="stat">🔥 <span id="streak">0</span></div>
        </div>
    </div>

    <div class="profile">
        <div class="avatar">🧸</div>
        <h1>Friendship Quiz</h1>
        <p>Test xem tình bạn của chúng ta đến đâu! 😎</p>
    </div>

    <div class="progress-box">
        <div class="progress-info">
            <span>💗 Cấp độ <b id="level">1</b></span>
            <span><span id="xp">0</span>/100 XP</span>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <div class="card">

        <div class="question-number">
            CÂU <span id="questionNumber">1</span>
        </div>

        <div class="question" id="question">
            Loading...
        </div>

        <div class="answers" id="answers"></div>

        <div class="message" id="message"></div>

        <button class="next" id="nextBtn" onclick="nextQuestion()">
            Câu tiếp theo →
        </button>

    </div>

    <div class="bottom">
        <button onclick="showAchievement()">🏆 Thành tích</button>
        <button onclick="resetGame()">🔄 Reset</button>
        <button onclick="showRules()">❓ Luật chơi</button>
    </div>

    <div class="overlay" id="overlay">
        <div class="result">
            <h2 id="overlayTitle">🎉</h2>
            <p id="overlayText"></p>

            <button class="restart" onclick="closeOverlay()">
                Tiếp tục chơi 💗
            </button>
        </div>
    </div>

</div>

<script>

const questions = [

{
    q: "Nếu bạn thân buồn, bạn sẽ làm gì?",
    answers: [
        "Ở bên và lắng nghe 💗",
        "Mặc kệ 😐",
        "Chọc cho vui 😂",
        "Đi ngủ 💤"
    ],
    correct: 0
},

{
    q: "Điều quan trọng nhất trong tình bạn là gì?",
    answers: [
        "Tiền 💰",
        "Sự tin tưởng 🤝",
        "Điểm số 📚",
        "Nổi tiếng ⭐"
    ],
    correct: 1
},

{
    q: "Bạn thân rủ đi chơi nhưng bạn đang bận. Bạn sẽ...",
    answers: [
        "Nói dối là không bận",
        "Từ chối luôn",
        "Giải thích và hẹn dịp khác",
        "Không trả lời"
    ],
    correct: 2
},

{
    q: "Bạn thân kể một bí mật. Bạn nên...",
    answers: [
        "Kể cho người khác 🤭",
        "Đăng story 📱",
        "Giữ bí mật 🤫",
        "Quên luôn"
    ],
    correct: 2
},

{
    q: "Một người bạn tốt sẽ...",
    answers: [
        "Luôn ủng hộ bạn ❤️",
        "Luôn thắng bạn",
        "Luôn đồng ý mọi thứ",
        "Chỉ xuất hiện khi cần"
    ],
    correct: 0
},

{
    q: "Nếu hai người bạn cãi nhau, điều tốt nhất là...",
    answers: [
        "Block nhau 🚫",
        "Nói chuyện bình tĩnh",
        "Đăng status bóng gió",
        "Không bao giờ nói chuyện nữa"
    ],
    correct: 1
},

{
    q: "Bạn thân đạt thành tích tốt. Bạn sẽ...",
    answers: [
        "Ghen tị",
        "Không quan tâm",
        "Chúc mừng thật lòng 🎉",
        "Nói rằng mình cũng làm được"
    ],
    correct: 2
},

{
    q: "Tình bạn lâu dài cần...",
    answers: [
        "Sự chân thành 💗",
        "Nhiều tiền",
        "Nhiều người biết",
        "Luôn ở cạnh nhau 24/7"
    ],
    correct: 0
}

];

let current = 0;
let score = Number(localStorage.getItem("friendScore")) || 0;
let streak = Number(localStorage.getItem("friendStreak")) || 0;
let xp = Number(localStorage.getItem("friendXP")) || 0;
let level = Number(localStorage.getItem("friendLevel")) || 1;

const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const questionNumberEl = document.getElementById("questionNumber");
const messageEl = document.getElementById("message");
const nextBtn = document.getElementById("nextBtn");

function loadQuestion() {

    const q = questions[current];

    questionNumberEl.textContent = current + 1;
    questionEl.textContent = q.q;

    answersEl.innerHTML = "";
    messageEl.textContent = "";
    nextBtn.style.display = "none";

    q.answers.forEach((answer, index) => {

        const btn = document.createElement("button");

        btn.className = "answer";
        btn.textContent = answer;

        btn.onclick = () => checkAnswer(index, btn);

        answersEl.appendChild(btn);

    });

}

function checkAnswer(index, button) {

    const q = questions[current];

    const allButtons = document.querySelectorAll(".answer");

    allButtons.forEach(btn => btn.disabled = true);

    if(index === q.correct) {

        button.classList.add("correct");

        score += 10;
        xp += 25;
        streak++;

        messageEl.textContent = "🎉 Chính xác! +10 điểm 💗";

        createHearts();

        if(xp >= 100) {
            xp -= 100;
            level++;

            setTimeout(() => {
                alert("🎊 LEVEL UP!\nBạn đã lên cấp " + level + "!");
            }, 300);
        }

    } else {

        button.classList.add("wrong");
        allButtons[q.correct].classList.add("correct");

        streak = 0;

        messageEl.textContent =
            "😅 Chưa đúng rồi! Đáp án đúng đã được đánh dấu.";

    }

    saveGame();
    updateUI();

    nextBtn.style.display = "block";

}

function nextQuestion() {

    current++;

    if(current >= questions.length) {
        showResult();
        current = 0;
        return;
    }

    loadQuestion();

}

function updateUI() {

    document.getElementById("score").textContent = score;
    document.getElementById("streak").textContent = streak;
    document.getElementById("level").textContent = level;
    document.getElementById("xp").textContent = xp;

    document.getElementById("progressBar").style.width =
        xp + "%";

}

function saveGame() {

    localStorage.setItem("friendScore", score);
    localStorage.setItem("friendStreak", streak);
    localStorage.setItem("friendXP", xp);
    localStorage.setItem("friendLevel", level);

}

function createHearts() {

    for(let i = 0; i < 5; i++) {

        const heart = document.createElement("div");

        heart.className = "heart";
        heart.textContent = ["💗","💕","💖","✨","❤️"][i];

        heart.style.left =
            (35 + Math.random() * 30) + "%";

        heart.style.top =
            (45 + Math.random() * 15) + "%";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 1500);

    }

}

function showResult() {

    document.getElementById("overlayTitle").textContent =
        "🎉 Hoàn thành!";

    document.getElementById("overlayText").innerHTML =
        "Bạn đã hoàn thành vòng chơi!<br><br>" +
        "⭐ Điểm: <b>" + score + "</b><br>" +
        "🔥 Streak: <b>" + streak + "</b><br>" +
        "💗 Level: <b>" + level + "</b>";

    document.getElementById("overlay").style.display =
        "flex";

}

function showAchievement() {

    let text = "";

    if(score >= 100)
        text += "🏆 Cao thủ tình bạn<br><br>";

    if(level >= 3)
        text += "⭐ Bạn đã đạt Level 3<br><br>";

    if(streak >= 5)
        text += "🔥 Streak Master<br><br>";

    if(text === "")
        text = "🔒 Chưa có thành tích nào.<br><br>Chơi thêm để mở khóa!";

    document.getElementById("overlayTitle").textContent =
        "🏆 Thành tích";

    document.getElementById("overlayText").innerHTML = text;

    document.getElementById("overlay").style.display =
        "flex";

}

function showRules() {

    document.getElementById("overlayTitle").textContent =
        "❓ Luật chơi";

    document.getElementById("overlayText").innerHTML =
        "Mỗi câu trả lời đúng nhận <b>10 điểm</b> và <b>25 XP</b>.<br><br>" +
        "Trả lời đúng liên tiếp để giữ 🔥 streak.<br><br>" +
        "Đủ 100 XP sẽ lên cấp! ⭐";

    document.getElementById("overlay").style.display =
        "flex";

}

function closeOverlay() {

    document.getElementById("overlay").style.display =
        "none";

}

function resetGame() {

    if(confirm("Bạn có chắc muốn xóa toàn bộ tiến trình không?")) {

        score = 0;
        streak = 0;
        xp = 0;
        level = 1;
        current = 0;

        saveGame();
        updateUI();
        loadQuestion();

    }

}

updateUI();
loadQuestion();

</script>

</body>
</html>
